<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- local copy: cdn.jsdelivr.net may be blocked in cloud sessions -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #07080a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
        background:
          radial-gradient(ellipse 80% 40% at 50% 26%, rgba(255, 214, 10, 0.14), transparent 70%),
          radial-gradient(ellipse 120% 70% at 50% 50%, #1c2027 0%, #0b0d10 60%, #050607 100%);
      }

      /* ---------- footage card: portrait footage under the caption band ---------- */
      #card {
        position: absolute;
        left: 0;
        top: 220px;
        width: 1080px;
        height: 1700px;
        overflow: hidden;
        background: #000;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 38%;
      }
      .shot video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #card-edge-top {
        position: absolute;
        left: 0;
        top: 220px;
        width: 1080px;
        height: 200px;
        background: linear-gradient(180deg, rgba(7, 8, 10, 0.92), rgba(7, 8, 10, 0));
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- captions (top safe zone, below TikTok's top bar) ---------- */
      .cap {
        position: absolute;
        left: 40px;
        top: 150px;
        width: 1000px;
        height: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .kick {
        display: block;
        font-weight: 900;
        font-size: 44px;
        letter-spacing: 0.06em;
        color: #ffffff;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
      }
      .big {
        display: block;
        font-family: "Archivo Black", sans-serif;
        font-size: 104px;
        line-height: 1.02;
        color: #ffd60a;
        text-shadow:
          0 6px 0 rgba(0, 0, 0, 0.55),
          0 10px 30px rgba(0, 0, 0, 0.6);
      }

      /* ---------- CTA ---------- */
      #cta {
        position: absolute;
        left: 40px;
        top: 620px;
        width: 1000px;
        height: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #cta .kick {
        font-size: 58px;
      }
      #cta .big {
        font-size: 128px;
      }
      #cta .big.white {
        color: #fff;
      }

      /* OYEN:CSS:START */
      /* OYEN:CSS:END */
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <!-- ================= FOOTAGE =================
        One .shot per cut; time the <video>, not the wrapper. Example:
        <div class="shot" data-layout-allow-overflow id="sh1">
          <video id="v1" class="clip" src="assets/source-portrait.mp4" data-start="0" data-duration="2"
                 data-media-start="12.5" data-track-index="0" playsinline data-has-audio="true"></video>
        </div>
      -->
      <div id="card"></div>
      <div id="card-edge-top"></div>

      <!-- ================= CAPTIONS ================= -->
      <div id="cap1" class="cap clip" data-start="0" data-duration="3" data-track-index="2">
        <span class="kick">TIMBANG BAGASI</span>
        <span class="big">TAK PAYAH TEKA!</span>
      </div>

      <!-- ================= CTA ================= -->
      <div id="cta" class="clip" data-start="3" data-duration="3" data-track-index="5">
        <span class="kick" id="cta-k">NAK SATU?</span>
        <span class="big white" id="cta-b1">TEKAN</span>
        <span class="big" id="cta-b2">BEG KUNING</span>
      </div>

      <!-- OYEN:START -->
      <!-- OYEN:END -->

      <div id="flash"></div>

      <!-- ================= SOUND FX (assets/sfx, see shared/sfx/CREDITS.md) ================= -->
      <!-- OYEN:SFX:START -->
      <!-- OYEN:SFX:END -->
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- helpers: all seek-safe ----------
      // zoom settle on a cut
      const settle = (sel, at, from = 1.07) =>
        tl.fromTo(sel, { scale: from }, { scale: 1, duration: 0.45, ease: "power2.out" }, at);
      // kicker slides up, big word slams in, both fade before the clip ends
      const caption = (id, at, dur) => {
        tl.fromTo(id + " .kick", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.02);
        tl.fromTo(id + " .big", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, at + 0.08);
        tl.to(id + " .kick, " + id + " .big", { opacity: 0, duration: 0.14, ease: "power1.in" }, at + dur - 0.14);
      };
      // reusable white flash: set() then to(), so seeking never shows a later hit early
      tl.set("#flash", { opacity: 0 }, 0);
      const flash = (at, peak = 0.3) =>
        tl.set("#flash", { opacity: peak }, at).to("#flash", { opacity: 0, duration: 0.18, ease: "power1.out" }, at);

      // ---------- scenes ----------
      caption("#cap1", 0, 3);
      flash(3);
      tl.fromTo("#cta-k", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.1);
      tl.fromTo("#cta-b1", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2.4)" }, 3.25);
      tl.fromTo("#cta-b2", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 3.42);

      // OYEN:START
      // OYEN:END

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
