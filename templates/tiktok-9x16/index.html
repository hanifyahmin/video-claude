<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- local copy: cdn.jsdelivr.net may be blocked in cloud sessions -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Montserrat, sans-serif;
        color: #fff;
        background: #000;
        --accent: #FFD60A;
        --on-accent: #111111;
      }

      /* ---------- footage: full-bleed shots, captions over a dark top fade ---------- */
      #card {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 38%;
      }
      .shot video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #card-edge-top {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 700px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.5) 50%, rgba(0, 0, 0, 0));
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- captions (top safe zone, below TikTok's top bar) ---------- */
      .cap {
        position: absolute;
        left: 40px;
        top: 150px;
        width: 1000px;
        height: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .kick {
        position: relative;
        z-index: 2;
        display: block;
        margin-bottom: 14px;
        padding: 8px 26px 10px;
        border-radius: 14px;
        background: var(--accent);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        font-weight: 800;
        font-size: 46px;
        line-height: 1.1;
        color: var(--on-accent);
        white-space: nowrap;
        transform: rotate(-2deg);
      }
      .big {
        position: relative;
        display: block;
        font-family: Montserrat, sans-serif;
        font-weight: 900;
        font-size: 100px;
        line-height: 1.04;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        color: #fff;
        white-space: nowrap;
        -webkit-text-stroke: 10px #111111;
        paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(0, 0, 0, 0.35);
      }
      .big::before,
      .big::after {
        content: none;
      }
      .big.white {
        color: #fff;
      }
      .big::before {
        display: none;
      }
      .big::after {
        display: none;
      }
      .big .hl {
        color: var(--accent);
      }

      /* ---------- CTA ---------- */
      #cta {
        position: absolute;
        left: 40px;
        top: 440px;
        width: 1000px;
        height: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #cta .kick {
        font-size: 58px;
      }
      #cta .big {
        font-size: 128px;
      }
      #cta .big.white {
        color: #fff;
      }
      #cta-btn {
        margin-top: 46px;
        display: flex;
        align-items: center;
        gap: 20px;
        height: 128px;
        padding: 0 50px 0 38px;
        border: 6px solid #111111;
        border-radius: 64px;
        background: var(--accent);
        font-weight: 900;
        font-size: 50px;
        color: var(--on-accent);
        box-shadow: 8px 8px 0 #111111;
      }

      /* OYEN:CSS:START */
      /* OYEN:CSS:END */
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <!-- ================= FOOTAGE =================
        One .shot per cut; time the <video>, not the wrapper. Example:
        <div class="shot" data-layout-allow-overflow id="sh1">
          <video id="v1" class="clip" src="assets/source-portrait.mp4" data-start="0" data-duration="2"
                 data-media-start="12.5" data-track-index="0" playsinline data-has-audio="true"></video>
        </div>
      -->
      <div id="card"></div>
      <div id="card-edge-top"></div>

      <!-- ================= CAPTIONS ================= -->
      <div id="cap1" class="cap clip" data-start="0" data-duration="3" data-track-index="2">
        <span class="kick">{{KICKER}}</span>
        <span class="big">{{HOOK}}</span>
      </div>

      <!-- ================= CTA (no arrow: the user asked for none in the end scene) ================= -->
      <div id="cta" class="clip" data-start="3" data-duration="3" data-track-index="5">
        <span class="kick" id="cta-k">NAK SATU?</span>
        <span class="big white" id="cta-b1">Tekan</span>
        <span class="big" id="cta-b2"><span class="hl">beg kuning</span></span>
        <div id="cta-btn">
          <svg width="64" height="64" viewBox="0 0 24 24">
            <path d="M6 7h14l-1.6 8.2a2 2 0 0 1-2 1.6H9.2a2 2 0 0 1-2-1.6L5.4 4.6A1 1 0 0 0 4.4 4H2.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="9.5" cy="20" r="1.6" fill="currentColor" />
            <circle cx="17" cy="20" r="1.6" fill="currentColor" />
          </svg>
          CHECK HARGA PROMO
        </div>
      </div>

      <!-- OYEN:START -->
      <!-- OYEN:END -->

      <div id="flash"></div>

      <!-- ================= SOUND FX (assets/sfx, see shared/sfx/CREDITS.md) ================= -->
      <!-- OYEN:SFX:START -->
      <!-- OYEN:SFX:END -->
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------- helpers: all seek-safe ----------
      // zoom settle on a cut
      const settle = (sel, at, from = 1.07) =>
        tl.fromTo(sel, { scale: from }, { scale: 1, duration: 0.45, ease: "power2.out" }, at);
      // kicker slides up, big word slams in, both fade before the clip ends
      const caption = (id, at, dur) => {
        tl.fromTo(id + " .kick", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.02);
        tl.fromTo(id + " .big", { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, at + 0.08);
        tl.to(id + " .kick, " + id + " .big", { opacity: 0, duration: 0.14, ease: "power1.in" }, at + dur - 0.14);
      };
      // reusable white flash: set() then to(), so seeking never shows a later hit early
      tl.set("#flash", { opacity: 0 }, 0);
      const flash = (at, peak = 0.3) =>
        tl.set("#flash", { opacity: peak }, at).to("#flash", { opacity: 0, duration: 0.18, ease: "power1.out" }, at);

      // ---------- scenes ----------
      caption("#cap1", 0, 3);
      flash(3);
      tl.fromTo("#cta-k", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.1);
      tl.fromTo("#cta-b1", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2.4)" }, 3.25);
      tl.fromTo("#cta-b2", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 3.42);
      tl.fromTo("#cta-btn", { opacity: 0, y: 60, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, 3.65);
      tl.to("#cta-btn", { scale: 1.07, duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: 5 }, 4.0);

      // OYEN:START
      // OYEN:END

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
